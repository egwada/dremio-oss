package com.dremio.service.acl.proto;

option java_package = "com.dremio.service.acl.proto";
option optimize_for = SPEED;
option java_outer_classname = "AclProtobuf";

// Type de privilège
enum PrivilegeType {
  SELECT = 1;
  INSERT = 2;
  UPDATE = 3;
  DELETE = 4;
  CREATE_TABLE = 5;
  CREATE_VIEW = 6;
  CREATE_FOLDER = 7;
  ALTER = 8;
  DROP = 9;
  MODIFY = 10;
  MANAGE_GRANTS = 11;
  USAGE = 12;
  ALL = 99;
}

// Type de ressource
enum ResourceType {
  DATASET = 1;      // Table ou View
  FOLDER = 2;       // Dossier/Space
  SOURCE = 3;       // Data source
  CATALOG = 4;      // Catalogue entier
  FUNCTION = 5;     // UDF
}

// Type de bénéficiaire
enum GranteeType {
  USER = 1;
  ROLE = 2;
}

// Un grant de privilège
message PrivilegeGrant {
  optional string grant_id = 1;              // UUID unique
  optional GranteeType grantee_type = 2;     // USER ou ROLE
  optional string grantee_name = 3;          // Nom du user ou role
  optional ResourceType resource_type = 4;   // Type de ressource
  repeated string resource_path = 5;         // Path complet (ex: ["source", "folder", "table"])
  repeated PrivilegeType privileges = 6;     // Liste des privilèges
  optional string granted_by = 7;            // Qui a fait le grant
  optional uint64 granted_at = 8;            // Timestamp
  optional bool with_grant_option = 9 [default = false]; // Peut re-granter
  optional string tag = 10;                  // Pour optimistic locking (version tag)
}

// Définition d'un rôle (Phase 2, mais on définit le proto maintenant)
message Role {
  optional string role_id = 1;           // UUID unique
  optional string role_name = 2;         // Nom du rôle (unique)
  optional string description = 3;       // Description
  optional string owner = 4;             // Propriétaire du rôle
  optional uint64 created_at = 5;        // Timestamp création
  optional uint64 modified_at = 6;       // Timestamp modification
  optional string tag = 7;               // Pour optimistic locking
}

// Membership user-role (Phase 2)
message RoleMembership {
  optional string membership_id = 1;     // UUID unique
  optional string role_name = 2;         // Nom du rôle
  optional string member_name = 3;       // Nom du membre (user ou role)
  optional GranteeType member_type = 4;  // USER ou ROLE
  optional string granted_by = 5;        // Qui a assigné
  optional uint64 granted_at = 6;        // Timestamp
  optional string tag = 7;               // Pour optimistic locking
}
